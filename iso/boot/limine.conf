timeout: 5
interface_branding: RockOS Boot Manager

# The first entry is the default. 32-bit runs on EVERY x86 PC (including
# 64-bit machines), so it is the safe default. Pick 64-bit manually.
/RockOS (32-bit, works on every PC)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos32.bin
    resolution: 1024x768x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE

/RockOS (64-bit)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos.bin
    resolution: 1024x768x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE
