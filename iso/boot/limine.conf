timeout: 5
interface_branding: RockOS Boot Manager

# Live sessions run from RAM and do not expose physical disks.
/Try RockOS live (32-bit)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos32.bin
    kernel_cmdline: rockos.live
    resolution: 1024x768x32
    textmode: no

/Try RockOS live (64-bit)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos.bin
    kernel_cmdline: rockos.live
    resolution: 1024x768x32
    textmode: no

# Installer entries include the installation image.
/RockOS (32-bit, works on every PC)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos32.bin
    resolution: 1024x768x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE

/RockOS (64-bit)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos.bin
    resolution: 1024x768x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE

/RockOS (32-bit, 1080p mode)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos32.bin
    resolution: 1920x1080x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE

/RockOS (64-bit, 1080p mode)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos.bin
    resolution: 1920x1080x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE

/RockOS (32-bit, 4K mode)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos32.bin
    resolution: 3840x2160x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE

/RockOS (64-bit, 4K mode)
    protocol: multiboot1
    kernel_path: boot():/boot/rockos.bin
    resolution: 3840x2160x32
    textmode: no
    module_path: boot():/boot/rockos-install.img
    module_string: ROCKOS_INSTALL_IMAGE
