name: build-iso

# Builds the RockOS bootable ISO (64-bit + 32-bit kernels, Limine BIOS/UEFI
# boot, installer image) from source — no PowerShell required: the
# committed src/drivers/ui_assets.h is used as-is.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-x86-64-linux-gnu gcc-multilib xorriso python3

      - name: Fetch Limine bootloader binaries
        run: |
          mkdir -p /tmp/limine
          curl -fsSL \
            https://github.com/Limine-Bootloader/Limine/releases/download/v12.9.6/limine-binary.tar.gz \
            | tar -xz -C /tmp/limine
          find /tmp/limine -maxdepth 2 -type f | sort
          echo "LIMINE_DIR=$(find /tmp/limine -name limine-bios.sys | head -1 | xargs dirname)" >> "$GITHUB_ENV"

      - name: Use committed UI assets (skip PowerShell regeneration)
        run: touch src/drivers/ui_assets.h

      - name: Build the limine host tool
        run: |
          make -C "$LIMINE_DIR" limine
          "$LIMINE_DIR/limine" --version || true

      - name: Build ISO (x86_64 + i386 kernels)
        run: |
          make -j2 all \
            TARGET64=x86_64-linux-gnu \
            TARGET32=x86_64-linux-gnu \
            LIMINE_TOOL="$LIMINE_DIR/limine" \
            LIMINE_DATA_DIR="$LIMINE_DIR"
          ls -lh
        env:
          PYTHON: python3

      - name: Smoke-test ISO structure
        run: |
          test -f "rockosdualbootv.1.iso"
          test -f iso/boot/rockos.bin
          test -f iso/boot/rockos32.bin
          test -f iso/boot/rockos-install.img
          grep -q "RockOS Boot Manager" iso/boot/limine.conf
          echo "ISO contents OK"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockos-iso
          path: |
            rockosdualbootv.1.iso
          if-no-files-found: error

      # Web (WASM) demo of the desktop UI, built with emscripten and
      # attached to releases next to the ISO.
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Build web (WASM) demo
        run: |
          emcc --version
          make web
          (cd web && zip -q ../rockos-web-demo.zip index.html rockos-web.js rockos-web.wasm)
          ls -lh rockos-web-demo.zip

      - name: Upload web demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockos-web-demo
          path: rockos-web-demo.zip
          if-no-files-found: error

      # Automated release: every successful build on main creates
      # release "automated release v0.0.<run>" tagged v0.0.<run>
      # (run numbers are monotonic and unique), with the ISO attached.
      - name: Create automated release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          gh release view "v0.0.$GITHUB_RUN_NUMBER" >/dev/null 2>&1 ||           gh release create "v0.0.$GITHUB_RUN_NUMBER" \
            --title "automated release v0.0.$GITHUB_RUN_NUMBER" \
            --notes "Automated build from commit $GITHUB_SHA — branch: main (ISO with the 64-bit + 32-bit kernels and the Limine installer image)." \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload ISO artifact (auto release)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          gh release upload "v0.0.$GITHUB_RUN_NUMBER" \
            rockosdualbootv.1.iso rockos-web-demo.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach ISO to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" \
          rockosdualbootv.1.iso rockos-web-demo.zip
        env:
          GH_TOKEN: ${{ github.token }}
